name: Deploy Site and Concept Viewer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./vogon-poetry-concept-viewer/package-lock.json

      - name: Install app deps
        working-directory: ./vogon-poetry-concept-viewer
        run: npm ci

      - name: Build app
        working-directory: ./vogon-poetry-concept-viewer
        run: npm run build

      - uses: actions/configure-pages@v5

      # container action: runs as root, so _site ends up owned by root
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # hand _site back to the runner user before any shell step touches it
      - name: Take ownership of _site
        run: sudo chown -R "$(id -u):$(id -g)" _site

      - name: Overlay app into site
        run: |
          rm -rf _site/vogon-poetry-concept-viewer
          mkdir -p _site/vogon-poetry-concept-viewer
          cp -r vogon-poetry-concept-viewer/dist/. _site/vogon-poetry-concept-viewer/

      - name: Verify artifact
        run: |
          test -f _site/vogon-poetry-concept-viewer/index.html
          test -d _site/vogon-poetry-concept-viewer/assets
          grep -q "/vogon-poetry/vogon-poetry-concept-viewer/assets/" _site/vogon-poetry-concept-viewer/index.html
          test ! -e _site/vogon-poetry-concept-viewer/src
          test ! -e _site/vogon-poetry-concept-viewer/node_modules
          test -f _site/index.html || echo "WARNING: no site root index.html"
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4