name: Deploy Site and Concept Viewer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./vogon-poetry-concept-viewer/package-lock.json

      - name: Install app deps
        working-directory: ./vogon-poetry-concept-viewer
        run: npm ci

      - name: Build app
        working-directory: ./vogon-poetry-concept-viewer
        run: npm run build

      # renders the REST of the repo (markdown and html pages) into _site
      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # overlay the built app into the subfolder the base path expects
      - name: Overlay app into site
        run: |
          rm -rf _site/vogon-poetry-concept-viewer
          mkdir -p _site/vogon-poetry-concept-viewer
          cp -r vogon-poetry-concept-viewer/dist/. _site/vogon-poetry-concept-viewer/
          test -f _site/index.html || echo "WARNING: no site root index.html"
          test -f _site/vogon-poetry-concept-viewer/index.html || exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4